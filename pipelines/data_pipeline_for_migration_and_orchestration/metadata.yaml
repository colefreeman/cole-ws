description: This migration process involves cloning or updating the existing dbt
  project repository into the mage pro environment, ensuring all assets are present
  and properly structured. once integrated, upstream mage blocks—such as airflow,
  dagster, prefect, or other orchestration tools—are connected to the dbt block within
  mage, which automatically manages source references and lineage by generating the
  `mage_sources.yml` configuration. the pipeline’s execution order, data dependencies,
  and source references are handled seamlessly by mage, with minimal manual intervention,
  enabling a consistent, version-controlled, and orchestrated data transformation
  workflow that bridges multiple tools and cloud platforms for end-to-end data processing.
