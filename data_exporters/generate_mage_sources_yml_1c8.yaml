# Generate mage_sources.yml - Data Exporter Block
# This block automatically creates and updates the mage_sources.yml file
# based on the latest outputs from upstream blocks, enabling seamless
# integration with dbt models and maintaining data lineage.

version: 2

sources:
  - description: Data sources generated by Mage upstream blocks
    loader: mage
    name: mage_pipeline_sources  # Name of the source, can be customized
    schema: public              # Target schema in your data warehouse
    tables:
      - description: Source table for connect_upstream_data_source_1c8 block
        # Unique identifier for the source table, typically composed of pipeline and block UUIDs
        identifier: mage_<pipeline_uuid>_<connect_upstream_data_source_1c8_uuid>
        meta:
          block_uuid: connect_upstream_data_source_1c8
          pipeline_uuid: <pipeline_uuid>  # Replace with actual pipeline UUID
        name: connect_upstream_data_source_1c8_source
        # Additional metadata can be added here if needed
